## ----- General Settings ----- ##

backend = "glx";

dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

log-level = "error";


## ----- Shadows ----- ##

shadow = false;
shadow-radius = 7;
shadow-opacity = 0.25;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-color = "#000000";


## ----- Fading ----- ##

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 6;

no-fading-openclose = false;
no-fading-destroyed-argb = false;


## ----- Transparency ----- ##

frame-opacity = 1.0;


## ----- Corners ----- ##

corner-radius = 6;


## ----- Blur ----- ##

blur: {
    method = "gaussian";
    size = 4;
    deviation = 2.5;
};


## ----- Rules ----- ##

rules = (

    # Default behavior
    {
        blur-background = false;
        fade = false;
    },

    # Normal application windows
    {
        match = "window_type = 'normal'
                 && !(class_g = 'Rofi'
                      || class_g = 'mpv')";

        fade = true;
        shadow = true;
    },

    # Dialog windows
    {
        match = "window_type = 'dialog'";
        fade = true;
        shadow = true;
    },

    # Tooltips
    {
        match = "window_type = 'tooltip'";
        corner-radius = 0;
        opacity = 0.90;
    },

    # Fullscreen windows
    {
        match = "fullscreen";
        corner-radius = 0;
    },

    # Menus
    {
        match = "window_type = 'dropdown_menu'
                 || window_type = 'menu'
                 || window_type = 'popup'
                 || window_type = 'popup_menu'";

        corner-radius = 0;
        shadow = false;
    },

    # Dunst notifications
    {
        match = "class_g = 'Dunst'";
        shadow = false;
        corner-radius = 0;
    },

    # Firefox
    {
        match = "class_g = 'firefox' || _GTK_FRAME_EXTENTS@";
        shadow = false;
    },

    # Rofi / mpv
    {
        match = "class_g = 'Rofi'
                 || class_g = 'mpv'";

        corner-radius = 0;
        fade = true;
        shadow = false;
    }

);


## ----- Animations ----- ##

animations = (

    # Window close
    {
        triggers = [ "close" ];

        opacity = {
            curve = "cubic-bezier(0,1,1,1)";
            duration = 0.3;
            start = "window-raw-opacity-before";
            end = 0;
        };

        blur-opacity = "opacity";
        shadow-opacity = "opacity";

        scale-x = {
            curve = "cubic-bezier(0,1.08,1,1)";
            duration = 0.3;
            start = 1;
            end = 0.6;
        };

        scale-y = "scale-x";

        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";

        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },

    # Window open
    {
        triggers = [ "open" ];

        opacity = {
            curve = "cubic-bezier(0,1,1,1)";
            duration = 0.5;
            start = 0;
            end = "window-raw-opacity";
        };

        blur-opacity = "opacity";
        shadow-opacity = "opacity";

        scale-x = {
            curve = "cubic-bezier(0,1.3,1,1)";
            duration = 0.5;
            start = 0.6;
            end = 1;
        };

        scale-y = "scale-x";

        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";

        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },

    # DWM tiling / movement animation
    {
        triggers = [ "size", "position" ];

        scale-x = {
            curve = "cubic-bezier(0,0,0,1.08)";
            duration = 0.5;
            start = "window-width-before / window-width";
            end = 1;
        };

        scale-x-reverse = {
            curve = "cubic-bezier(0,0,0,1.28)";
            duration = 0.5;
            start = "window-width / window-width-before";
            end = 1;
        };

        scale-y = {
            curve = "cubic-bezier(0,0,0,1.28)";
            duration = 0.5;
            start = "window-height-before / window-height";
            end = 1;
        };

        scale-y-reverse = {
            curve = "cubic-bezier(0,0,0,1.28)";
            duration = 0.5;
            start = "window-height / window-height-before";
            end = 1;
        };

        offset-x = {
            curve = "cubic-bezier(0,0,0,1.28)";
            duration = 0.5;
            start = "window-x-before - window-x";
            end = 0;
        };

        offset-y = {
            curve = "cubic-bezier(0,0,0,1.28)";
            duration = 0.5;
            start = "window-y-before - window-y";
            end = 0;
        };

        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    }

);
