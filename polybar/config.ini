[colors]
background = #ee303446
background-alt = #414559
foreground = #c6d0f5
muted = #838ba7
red = #e78284
green = #a6d189
yellow = #e5c890
blue = #8caaee
pink = #f4b8e4
teal = #81c8be

[bar/main]
width = 100%
height = 48pt
radius = 10
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3pt
border-size = 6pt
border-color = #00000000
padding-left = 1
padding-right = 1
module-margin = 1
bottom = true

font-0 = JetBrainsMono Nerd Font:size=22;3
font-1 = JetBrainsMono Nerd Font:size=32;3

modules-left = xworkspaces
modules-center = xwindow
modules-right = filesystem cpu memory network pulseaudio backlight battery date tray

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-foreground = ${colors.blue}
label-active-underline = ${colors.blue}
label-active-padding = 2

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:…%
label-foreground = ${colors.foreground}
label-empty = Desktop
label-empty-foreground = ${colors.muted}

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
label-mounted =  %percentage_used%%
label-mounted-foreground = ${colors.teal}
label-unmounted =

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.yellow}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.pink}
label = %percentage_used%%

[module/network]
type = internal/network
interface-type = wireless
interval = 3
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.green}
label-connected = %essid%
format-disconnected-prefix = " "
format-disconnected-prefix-foreground = ${colors.red}
label-disconnected = offline

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.blue}
label-volume = %percentage%%
format-muted-prefix = " "
format-muted-prefix-foreground = ${colors.muted}
label-muted = muted
click-right = pavucontrol

[module/backlight]
type = internal/backlight
card = intel_backlight
enable-scroll = true
format-prefix = " "
format-prefix-foreground = ${colors.yellow}
label = %percentage%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP0
full-at = 98
poll-interval = 5
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.green}
format-discharging-prefix = " "
format-discharging-prefix-foreground = ${colors.yellow}
format-full-prefix = " "
format-full-prefix-foreground = ${colors.green}
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

[module/date]
type = internal/date
interval = 1
date = %a %b %d
time = %H:%M
label =  %date%  %time%
label-foreground = ${colors.blue}

[module/tray]
type = internal/tray
format-margin = 8pt
tray-spacing = 8pt

[settings]
screenchange-reload = true
pseudo-transparency = true
