name: Build selected Alpine packages from aports

on:
  workflow_dispatch:

  push:
    branches:
      - builds
    tags:
      - "v*"

permissions:
  contents: read

env:
  ALPINE_IMAGE: alpine:edge
  APORTS_REF: master

  # Binary package names to build from source.
  # Dependency aports returned by lua-aports are built first.
  ROOT_PACKAGES: >-
    fzf
    tmux
    neovim

jobs:
  build:
    name: Build selected x86_64 APK closure
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out Alpine aports
        uses: actions/checkout@v7
        with:
          repository: alpinelinux/aports
          ref: ${{ env.APORTS_REF }}
          path: aports
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare directories
        run: |
          set -euo pipefail

          mkdir -p \
            packages \
            distfiles \
            keys \
            metadata \
            offline-repository

          git -C aports rev-parse HEAD \
            > metadata/APORTS_COMMIT

          printf '%s\n' $ROOT_PACKAGES \
            > metadata/world.txt

          echo "Aports commit:"
          cat metadata/APORTS_COMMIT

          echo
          echo "Requested packages:"
          cat metadata/world.txt

      - name: Resolve and build package closure
        env:
          ROOT_PACKAGES: ${{ env.ROOT_PACKAGES }}
        run: |
          set -euo pipefail

          docker run --rm \
            --privileged \
            --env ROOT_PACKAGES \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$ALPINE_IMAGE" \
            sh -euxc '
              #
              # These packages are disposable build infrastructure.
              # They are not copied into the final repository unless they
              # are also built from an APKBUILD below.
              #
              apk add --no-cache \
                alpine-sdk \
                lua-aports \
                doas

              adduser -D builder
              addgroup builder abuild

              install -d -m 0755 /etc/doas.d

              printf "%s\n" \
                "permit nopass :abuild" \
                > /etc/doas.d/abuild.conf

              chmod 0600 /etc/doas.d/abuild.conf

              install -d \
                -o builder \
                -g builder \
                /home/builder/.abuild \
                /workspace/packages \
                /workspace/distfiles \
                /workspace/keys \
                /workspace/metadata

              chown -R builder:builder \
                /workspace/aports \
                /workspace/packages \
                /workspace/distfiles \
                /workspace/keys \
                /workspace/metadata

              su builder -c "
                set -eu
                abuild-keygen -a -n
              "

              private_key=""
              public_key=""

              for candidate in /home/builder/.abuild/*.rsa; do
                if [ -f "$candidate" ]; then
                  private_key="$candidate"
                  break
                fi
              done

              for candidate in /home/builder/.abuild/*.rsa.pub; do
                if [ -f "$candidate" ]; then
                  public_key="$candidate"
                  break
                fi
              done

              if [ -z "$private_key" ]; then
                echo "No private abuild key was generated" >&2
                exit 1
              fi

              if [ -z "$public_key" ]; then
                echo "No public abuild key was generated" >&2
                exit 1
              fi

              cp "$public_key" /etc/apk/keys/
              cp "$public_key" /workspace/keys/

              jobs="$(getconf _NPROCESSORS_ONLN)"

              #
              # Do not use an indented heredoc here. In YAML, the terminator
              # can remain indented after parsing and BusyBox sh will consume
              # the rest of the script as heredoc input.
              #
              printf "%s\n" \
                "REPODEST=/workspace/packages" \
                "SRCDEST=/workspace/distfiles" \
                "PACKAGER=\"Local Builder <builder@localhost>\"" \
                "PACKAGER_PRIVKEY=\"$private_key\"" \
                "JOBS=$jobs" \
                > /home/builder/.abuild/abuild.conf

              chown builder:builder \
                /home/builder/.abuild/abuild.conf

              arch="$(apk --print-arch)"

              printf "%s\n" "$arch" \
                > /workspace/metadata/ARCHITECTURE

              cat /etc/alpine-release \
                > /workspace/metadata/ALPINE_RELEASE

              echo
              echo "Architecture: $arch"
              echo "Build jobs:   $jobs"

              #
              # Keep locally built packages ahead of the bootstrap
              # repositories. This lets later builds use dependencies that
              # were built earlier in this job.
              #
              bootstrap_repositories="$(
                cat /etc/apk/repositories
              )"

              install -d \
                -o builder \
                -g builder \
                "/workspace/packages/main/$arch" \
                "/workspace/packages/community/$arch" \
                "/workspace/packages/testing/$arch"

              printf "%s\n" \
                "/workspace/packages/main/$arch" \
                "/workspace/packages/community/$arch" \
                "/workspace/packages/testing/$arch" \
                "$bootstrap_repositories" \
                > /etc/apk/repositories

              cd /workspace/aports

              #
              # Confirm each requested binary package maps to an aport.
              #
              : > /workspace/metadata/root-aports.txt

              for root_package in $ROOT_PACKAGES; do
                root_dir="$(
                  ap builddirs "$root_package" |
                    head -n 1
                )"

                if [ -z "$root_dir" ]; then
                  echo "Could not find aport for package: $root_package" >&2
                  exit 1
                fi

                printf "%s\n" "$root_dir" \
                  >> /workspace/metadata/root-aports.txt
              done

              awk \
                "NF && !seen[\$0]++" \
                /workspace/metadata/root-aports.txt \
                > /workspace/metadata/root-aports.unique.txt

              mv \
                /workspace/metadata/root-aports.unique.txt \
                /workspace/metadata/root-aports.txt

              echo
              echo "Root aports:"
              cat /workspace/metadata/root-aports.txt

              #
              # Resolve recursive dependencies and convert their binary
              # package names to owning aport directories.
              #
              # Do not sort this list: the resolver output order is retained
              # so dependencies can be built before packages that use them.
              #
              ap recursdeps $ROOT_PACKAGES \
                > /workspace/metadata/dependency-packages.txt

              : > /workspace/metadata/dependency-aports.txt

              if [ -s /workspace/metadata/dependency-packages.txt ]; then
                xargs ap builddirs \
                  < /workspace/metadata/dependency-packages.txt \
                  > /workspace/metadata/dependency-aports.txt
              fi

              #
              # Dependencies first, requested roots last.
              # Remove duplicates while preserving the first occurrence.
              #
              cat \
                /workspace/metadata/dependency-aports.txt \
                /workspace/metadata/root-aports.txt |
                awk "NF && !seen[\$0]++" \
                > /workspace/metadata/aport-closure.txt

              echo
              echo "Resolved dependency packages:"
              cat /workspace/metadata/dependency-packages.txt

              echo
              echo "Aports to build:"
              cat /workspace/metadata/aport-closure.txt

              echo
              echo "Number of aports:"
              wc -l < /workspace/metadata/aport-closure.txt

              chown -R builder:builder \
                /workspace/packages \
                /workspace/distfiles \
                /workspace/metadata

              #
              # Build every resolved aport from its checked-out APKBUILD.
              #
              # Build-only tools may be installed from the bootstrap
              # repositories by abuild -r. Only APKs produced in
              # /workspace/packages are retained.
              #
              while IFS= read -r aport_dir; do
                [ -n "$aport_dir" ] || continue

                case "$aport_dir" in
                  /workspace/aports/*)
                    package_dir="$aport_dir"
                    ;;

                  /*)
                    package_dir="$aport_dir"
                    ;;

                  *)
                    package_dir="/workspace/aports/$aport_dir"
                    ;;
                esac

                if [ ! -f "$package_dir/APKBUILD" ]; then
                  echo "Missing APKBUILD: $package_dir" >&2
                  exit 1
                fi

                echo
                echo "=================================================="
                echo "Building: $aport_dir"
                echo "=================================================="

                su builder -c "
                  set -eu
                  cd \"$package_dir\"
                  abuild -r
                "
              done < /workspace/metadata/aport-closure.txt

              echo
              echo "Built APK count:"
              find /workspace/packages \
                -type f \
                -name "*.apk" |
                wc -l

              echo
              echo "Built package repository size:"
              du -sh /workspace/packages
            '

      - name: Assemble flat offline repository
        run: |
          set -euo pipefail

          while IFS= read -r -d '' package; do
            filename="$(basename "$package")"
            destination="offline-repository/$filename"

            if [[ -e "$destination" ]]; then
              if ! cmp --silent "$package" "$destination"; then
                echo "Conflicting APK files named: $filename" >&2
                echo "Existing: $destination" >&2
                echo "New:      $package" >&2
                exit 1
              fi

              continue
            fi

            cp -v "$package" "$destination"
          done < <(
            find packages \
              -type f \
              -name "*.apk" \
              -print0
          )

          if ! compgen -G "offline-repository/*.apk" >/dev/null; then
            echo "No APK files were built" >&2
            exit 1
          fi

          cp -v keys/*.rsa.pub offline-repository/
          cp -v metadata/* offline-repository/

          echo
          echo "Offline APK count:"
          find offline-repository \
            -maxdepth 1 \
            -type f \
            -name "*.apk" |
            wc -l

          echo
          echo "Offline repository size:"
          du -sh offline-repository

      - name: Create repository index
        run: |
          set -euo pipefail

          docker run --rm \
            --volume \
              "$GITHUB_WORKSPACE/offline-repository:/repository" \
            "$ALPINE_IMAGE" \
            sh -euxc '
              apk index \
                --allow-untrusted \
                --description \
                  "Locally source-built Alpine package closure" \
                --output /repository/APKINDEX.tar.gz \
                /repository/*.apk

              echo
              echo "Repository index:"
              ls -lh /repository/APKINDEX.tar.gz
            '

      - name: Verify repository without networking
        env:
          ROOT_PACKAGES: ${{ env.ROOT_PACKAGES }}
        run: |
          set -euo pipefail

          docker run --rm \
            --network none \
            --env ROOT_PACKAGES \
            --volume \
              "$GITHUB_WORKSPACE/offline-repository:/offline:ro" \
            "$ALPINE_IMAGE" \
            sh -euxc '
              public_key=""

              for candidate in /offline/*.rsa.pub; do
                if [ -f "$candidate" ]; then
                  public_key="$candidate"
                  break
                fi
              done

              if [ -z "$public_key" ]; then
                echo "No public signing key found" >&2
                exit 1
              fi

              cp "$public_key" /etc/apk/keys/

              printf "%s\n" \
                /offline \
                > /etc/apk/repositories

              apk add \
                --no-network \
                --allow-untrusted \
                $ROOT_PACKAGES

              echo
              echo "Installed root packages:"

              for package in $ROOT_PACKAGES; do
                apk info -e "$package"
              done

              echo
              echo "fzf:"
              fzf --version

              echo
              echo "tmux:"
              tmux -V

              echo
              echo "Neovim:"
              nvim --version
            '

      - name: Create repository archive
        run: |
          set -euo pipefail

          tar \
            --create \
            --zstd \
            --file alpine-edge-x86_64-offline-apks.tar.zst \
            offline-repository

          sha256sum \
            alpine-edge-x86_64-offline-apks.tar.zst \
            > alpine-edge-x86_64-offline-apks.tar.zst.sha256

          echo
          ls -lh \
            alpine-edge-x86_64-offline-apks.tar.zst \
            alpine-edge-x86_64-offline-apks.tar.zst.sha256

      - name: Upload offline APK repository
        uses: actions/upload-artifact@v6
        with:
          name: alpine-edge-x86_64-offline-apk-repository
          path: |
            offline-repository/
            alpine-edge-x86_64-offline-apks.tar.zst
            alpine-edge-x86_64-offline-apks.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload source cache
        uses: actions/upload-artifact@v6
        with:
          name: alpine-edge-source-distfiles
          path: distfiles/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
