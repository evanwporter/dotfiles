name: Build Alpine offline APK repository

on:
  workflow_dispatch:

  push:
    branches:
      - builds
    tags:
      - "v*"

permissions:
  contents: read

env:
  ALPINE_IMAGE: alpine:edge
  APORTS_BRANCH: master

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    strategy:
      fail-fast: false

      matrix:
        include:
          # - name: curl
          #   aport: curl
          #
          # - name: git
          #   aport: git
          #
          # - name: gcc
          #   aport: gcc
          #
          # - name: cmake
          #   aport: cmake
          #
          # - name: ninja
          #   aport: samurai
          #
          # - name: make
          #   aport: make
          #
          # - name: clangd
          #   aport: clang20
          #
          # - name: ripgrep
          #   aport: ripgrep
          #
          # - name: eza
          #   aport: eza
          #
          # - name: bat
          #   aport: bat
          #
          # - name: fd
          #   aport: fd
          #
          # - name: yazi
          #   aport: yazi
          #
          # - name: fish
          #   aport: fish
          #
          # - name: delta
          #   aport: delta
          #
          # - name: uv
          #   aport: uv
          #
          # - name: lazygit
          #   aport: lazygit
          #
          # - name: glow
          #   aport: glow
          #
          # - name: fzf
          #   aport: fzf

          - name: tmux
            aport: tmux

          - name: neovim
            aport: neovim

    steps:
      - name: Check out Alpine aports mirror
        uses: actions/checkout@v5
        with:
          repository: alpinelinux/aports
          ref: ${{ env.APORTS_BRANCH }}
          path: aports
          fetch-depth: 1
          persist-credentials: false

      - name: Build ${{ matrix.name }} APKs
        env:
          APORT: ${{ matrix.aport }}
        run: |
          set -euo pipefail

          mkdir -p dist

          docker run --rm \
            --privileged \
            --env APORT \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$ALPINE_IMAGE" \
            sh -euxc '
              apk add --no-cache \
                alpine-sdk \
                doas

              adduser -D builder
              addgroup builder abuild

              install -d -m 0755 /etc/doas.d

              printf "%s\n" \
                "permit nopass :abuild" \
                > /etc/doas.d/abuild.conf

              chmod 0600 /etc/doas.d/abuild.conf

              package_dir=""

              for repository in main community testing; do
                candidate="/workspace/aports/$repository/$APORT"

                if [ -f "$candidate/APKBUILD" ]; then
                  package_dir="$candidate"
                  break
                fi
              done

              if [ -z "$package_dir" ]; then
                echo "Could not find APKBUILD for aport: $APORT" >&2
                echo "Checked:" >&2
                echo "  /workspace/aports/main/$APORT" >&2
                echo "  /workspace/aports/community/$APORT" >&2
                echo "  /workspace/aports/testing/$APORT" >&2
                exit 1
              fi

              echo "Aport:     $APORT"
              echo "Directory: $package_dir"

              install -d \
                -o builder \
                -g builder \
                /home/builder/.abuild \
                /home/builder/packages

              chown -R builder:builder \
                /workspace/aports \
                /home/builder

              su builder -c "
                set -eu
                abuild-keygen -a -n
              "

              public_key=""

              for candidate in /home/builder/.abuild/*.rsa.pub; do
                if [ -f "$candidate" ]; then
                  public_key="$candidate"
                  break
                fi
              done

              if [ -z "$public_key" ]; then
                echo "abuild-keygen did not create a public key" >&2
                exit 1
              fi

              cp "$public_key" /etc/apk/keys/

              su builder -c "
                set -eu
                cd \"$package_dir\"
                abuild -r
              "

              find /home/builder/packages \
                -type f \
                -name "*.apk" \
                -exec cp -v {} /workspace/dist/ \;

              produced_package=""

              for candidate in /workspace/dist/*.apk; do
                if [ -f "$candidate" ]; then
                  produced_package="$candidate"
                  break
                fi
              done

              if [ -z "$produced_package" ]; then
                echo "abuild completed but produced no APK files" >&2
                exit 1
              fi

              echo
              echo "Produced APKs:"
              ls -lh /workspace/dist
            '

      - name: Upload ${{ matrix.name }} APKs
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}-x86_64-alpine-apks
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  bundle:
    name: Create offline x86_64 APK repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: build

    steps:
      - name: Download all built APK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-x86_64-alpine-apks"
          path: downloaded-apks

      - name: Collect locally built APKs
        run: |
          set -euo pipefail

          mkdir -p offline-repository

          while IFS= read -r -d "" package; do
            filename="$(basename "$package")"
            destination="offline-repository/$filename"

            if [[ -e "$destination" ]]; then
              if ! cmp --silent "$package" "$destination"; then
                echo "Conflicting APK files named $filename" >&2
                exit 1
              fi

              continue
            fi

            cp -v "$package" "$destination"
          done < <(
            find downloaded-apks \
              -type f \
              -name "*.apk" \
              -print0
          )

          if ! compgen -G "offline-repository/*.apk" >/dev/null; then
            echo "No APK files were downloaded" >&2
            exit 1
          fi

          echo "Locally built packages:"
          ls -lh offline-repository

      - name: Resolve complete runtime dependency closure
        run: |
          set -euo pipefail

          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$ALPINE_IMAGE" \
            sh -euxc '
              repository=/workspace/offline-repository
              resolved=/tmp/resolved

              mkdir -p "$resolved"

              apk index \
                --description "Locally built Alpine Edge packages" \
                --output "$repository/APKINDEX.tar.gz" \
                "$repository"/*.apk

              cat > /tmp/repositories <<EOF
              $repository
              https://dl-cdn.alpinelinux.org/alpine/edge/main
              https://dl-cdn.alpinelinux.org/alpine/edge/community
              https://dl-cdn.alpinelinux.org/alpine/edge/testing
              EOF

              # These are package names, not necessarily aport names.
              #
              # samurai provides the ninja executable.
              # clang20-extra-tools contains clangd.
              set -- \
                curl \
                git \
                gcc \
                g++ \
                cmake \
                samurai \
                make \
                clang20-extra-tools \
                ripgrep \
                eza \
                bat \
                fd \
                yazi \
                fish \
                delta \
                erdtree \
                uv \
                lazygit \
                glow \
                fzf \
                tmux \
                neovim

              printf "%s\n" "$@" > "$repository/world.txt"

              apk fetch \
                --allow-untrusted \
                --recursive \
                --repositories-file /tmp/repositories \
                --output "$resolved" \
                "$@"

              for package in "$resolved"/*.apk; do
                [ -f "$package" ] || continue

                filename="${package##*/}"
                destination="$repository/$filename"

                if [ -e "$destination" ]; then
                  continue
                fi

                cp -v "$package" "$destination"
              done

              rm -f "$repository/APKINDEX.tar.gz"

              apk index \
                --description \
                  "Offline Alpine Edge x86_64 CLI repository" \
                --output "$repository/APKINDEX.tar.gz" \
                "$repository"/*.apk

              echo
              echo "Complete offline repository:"
              du -sh "$repository"
              ls -lh "$repository"
            '

      - name: Verify repository with networking disabled
        run: |
          set -euo pipefail

          docker run --rm \
            --network none \
            --volume \
              "$GITHUB_WORKSPACE/offline-repository:/offline:ro" \
            "$ALPINE_IMAGE" \
            sh -euxc '
              printf "%s\n" /offline > /etc/apk/repositories

              apk add \
                --no-network \
                --allow-untrusted \
                curl \
                git \
                gcc \
                g++ \
                cmake \
                samurai \
                make \
                clang20-extra-tools \
                ripgrep \
                eza \
                bat \
                fd \
                yazi \
                fish \
                delta \
                erdtree \
                uv \
                lazygit \
                glow \
                fzf \
                tmux \
                neovim

              curl --version
              git --version
              gcc --version
              g++ --version
              cmake --version
              ninja --version
              make --version
              clangd --version
              rg --version
              eza --version
              bat --version
              fd --version
              yazi --version
              fish --version
              delta --version
              erd --version
              uv --version
              lazygit --version
              glow --version
              fzf --version
              tmux -V
              nvim --version
            '

      - name: Create offline repository archive
        run: |
          set -euo pipefail

          tar \
            --create \
            --zstd \
            --file alpine-edge-x86_64-offline-apks.tar.zst \
            offline-repository

          sha256sum \
            alpine-edge-x86_64-offline-apks.tar.zst \
            > alpine-edge-x86_64-offline-apks.tar.zst.sha256

          ls -lh \
            alpine-edge-x86_64-offline-apks.tar.zst \
            alpine-edge-x86_64-offline-apks.tar.zst.sha256

      - name: Upload complete offline APK repository
        uses: actions/upload-artifact@v6
        with:
          name: alpine-edge-x86_64-offline-apk-repository
          path: |
            offline-repository/
            alpine-edge-x86_64-offline-apks.tar.zst
            alpine-edge-x86_64-offline-apks.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
