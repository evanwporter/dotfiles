                  -name "$APORT" \
                  -print \
                  -quit
              )"

              if [ -z "$package_dir" ]; then
                echo "Could 
            sh -euxc '
              apk add --no-cache \
                alpine-sdk \
                doas \
                findutils

              adduser -D builder
              addgroup builder abuild

              install -d -m 0755 /etc/doas.d
              echo "permit nopass builder" \
                > /etc/doas.d/builder.conf

              mkdir -p /home/builder/.abuild
              chown -R builder:builder \
                /home/builder \
                /workspace/aports

              package_dir="$(
                find \
                  /workspace/aports/main \
                  /workspace/aports/community \
                  /workspace/aports/testing \
                  -mindepth 1 \
                  -maxdepth 1 \
                  -type d \
                  -name "$APORT" \
                  -print \
                  -quit
              )"

              if [ -z "$package_dir" ]; then
                echo "Could not find aport: $APORT" >&2
                exit 1
              fi

              test -f "$package_dir/APKBUILD"

              echo "Building aport from $package_dir"

              su builder -c "
                set -eu

                abuild-keygen -a -n

                cd \"$package_dir\"
                abuild -r
              "

              mkdir -p /workspace/dist

              find /home/builder/packages \
                -type f \
                -name "*.apk" \
                -exec cp -v {} /workspace/dist/ \;

              test -n "$(
                find /workspace/dist \
                  -type f \
                  -name "*.apk" \
                  -print \
                  -quit
              )"
            '

      - name: Upload ${{ matrix.package }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-alpine
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
