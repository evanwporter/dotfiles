name: Build Alpine packages

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  ALPINE_IMAGE: alpine:edge
  APORTS_BRANCH: master

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: ripgrep
            aport: ripgrep

          - name: eza
            aport: eza

          - name: bat
            aport: bat

          - name: fd
            aport: fd

          - name: yazi
            aport: yazi

          - name: fish
            aport: fish

          - name: delta
            aport: delta

          # - name: erdtree
          #   aport: erdtree

          - name: uv
            aport: uv

          - name: lazygit
            aport: lazygit

          - name: glow
            aport: glow

          - name: fzf
            aport: fzf

          - name: tmux
            aport: tmux

          - name: neovim
            aport: neovim

          - name: glow
            aport: glow

          - name: curl
            aport: curl

          - name: git
            aport: git

          - name: gcc
            aport: gcc

          - name: cmake
            aport: cmake

          - name: ninja
            aport: samurai

          - name: make
            aport: make

          - name: clang
            aport: clang20

    steps:
      - name: Check out Alpine aports mirror
        uses: actions/checkout@v4
        with:
          repository: alpinelinux/aports
          ref: ${{ env.APORTS_BRANCH }}
          path: aports
          fetch-depth: 1

      - name: Build ${{ matrix.name }}
        env:
          APORT: ${{ matrix.aport }}
        run: |
          set -euo pipefail

          mkdir -p dist

          docker run --rm \
            --privileged \
            --env APORT \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$ALPINE_IMAGE" \
            sh -euxc '
              apk add --no-cache \
                alpine-sdk \
                doas

              adduser -D builder
              addgroup builder abuild

              install -d -m 0755 /etc/doas.d

              printf "%s\n" \
                "permit nopass :abuild" \
                > /etc/doas.d/abuild.conf

              chmod 0600 /etc/doas.d/abuild.conf

              package_dir=""

              for repository in main community testing; do
                candidate="/workspace/aports/$repository/$APORT"

                if [ -f "$candidate/APKBUILD" ]; then
                  package_dir="$candidate"
                  break
                fi
              done

              if [ -z "$package_dir" ]; then
                echo "Could not find APKBUILD for aport: $APORT" >&2
                echo "Checked:" >&2
                echo "  /workspace/aports/main/$APORT" >&2
                echo "  /workspace/aports/community/$APORT" >&2
                echo "  /workspace/aports/testing/$APORT" >&2
                exit 1
              fi

              echo "Aport:     $APORT"
              echo "Directory: $package_dir"

              install -d \
                -o builder \
                -g builder \
                /home/builder/.abuild \
                /home/builder/packages

              chown -R builder:builder \
                /workspace/aports \
                /home/builder

              su builder -c "
                set -eu
                abuild-keygen -a -n
              "

              public_key=""

              for candidate in /home/builder/.abuild/*.rsa.pub; do
                if [ -f "$candidate" ]; then
                  public_key="$candidate"
                  break
                fi
              done

              if [ -z "$public_key" ]; then
                echo "abuild-keygen did not create a public key" >&2
                exit 1
              fi

              cp "$public_key" /etc/apk/keys/

              su builder -c "
                set -eu
                cd \"$package_dir\"
                abuild -r
              "

              find /home/builder/packages \
                -type f \
                -name "*.apk" \
                -exec cp -v {} /workspace/dist/ \;

              produced_package=""

              for candidate in /workspace/dist/*.apk; do
                if [ -f "$candidate" ]; then
                  produced_package="$candidate"
                  break
                fi
              done

              if [ -z "$produced_package" ]; then
                echo "abuild completed but produced no APK files" >&2
                exit 1
              fi

              echo
              echo "Produced packages:"
              ls -lh /workspace/dist
            '

      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-alpine
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
