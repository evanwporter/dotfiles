name: Build Alpine CLI packages

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  ALPINE_IMAGE: alpine:edge
  APORTS_BRANCH: master

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: ripgrep
            aport: ripgrep

          - name: eza
            aport: eza

          - name: bat
            aport: bat

          - name: fd
            aport: fd

          - name: yazi
            aport: yazi

          - name: fish
            aport: fish

          - name: delta
            aport: git-delta

          - name: erdtree
            aport: erdtree

          - name: uv
            aport: uv

          - name: lazygit
            aport: lazygit

          - name: glow
            aport: glow

          - name: fzf
            aport: fzf

          - name: tmux
            aport: tmux

          - name: neovim
            aport: neovim

    steps:
      - name: Clone Alpine aports
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch "$APORTS_BRANCH" \
            https://gitlab.alpinelinux.org/alpine/aports.git \
            aports

      - name: Build ${{ matrix.name }}
        env:
          APORT: ${{ matrix.aport }}
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          docker run --rm \
            --env APORT \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$ALPINE_IMAGE" \
            sh -euxc '
              apk add --no-cache \
                alpine-sdk \
                doas

              adduser -D builder
              addgroup builder abuild

              install -d -m 0755 /etc/doas.d

              printf "%s\n" \
                "permit nopass :abuild" \
                > /etc/doas.d/abuild.conf

              chmod 0600 /etc/doas.d/abuild.conf

              # Locate the tracked APKBUILD through Git rather than scanning
              # the filesystem or hard-coding main/community/testing.
              matches="$(
                git -C /workspace/aports \
                  ls-files "*/$APORT/APKBUILD"
              )"

              match_count="$(
                printf "%s\n" "$matches" |
                  sed "/^$/d" |
                  wc -l
              )"

              if [ "$match_count" -eq 0 ]; then
                echo "No APKBUILD found for aport: $APORT" >&2
                exit 1
              fi

              if [ "$match_count" -ne 1 ]; then
                echo "Multiple APKBUILD files found for aport: $APORT" >&2
                printf "%s\n" "$matches" >&2
                exit 1
              fi

              apkbuild="/workspace/aports/$matches"
              package_dir="${apkbuild%/APKBUILD}"

              test -f "$apkbuild"

              echo "Aport:       $APORT"
              echo "APKBUILD:    $apkbuild"
              echo "Package dir: $package_dir"

              install -d \
                -o builder \
                -g builder \
                /home/builder \
                /home/builder/.abuild \
                /home/builder/packages

              chown -R builder:builder \
                /workspace/aports \
                /home/builder

              # Generate the package-signing key as the build user.
              su builder -c "
                set -eu
                abuild-keygen -n
              "

              # Trust the generated key while this temporary builder exists.
              set -- /home/builder/.abuild/*.rsa.pub

              if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
                echo "Expected one generated abuild public key" >&2
                exit 1
              fi

              cp "$1" /etc/apk/keys/

              # abuild reads source, depends, makedepends, checkdepends,
              # build(), check(), package(), and subpackages from APKBUILD.
              su builder -c "
                set -eu
                cd \"$package_dir\"
                abuild -r
              "

              # abuild normally writes packages under:
              # /home/builder/packages/<repository>/<architecture>/
              set -- /home/builder/packages/*/*/*.apk

              if [ "$#" -eq 1 ] && [ ! -f "$1" ]; then
                echo "abuild produced no APK packages" >&2
                exit 1
              fi

              cp -v "$@" /workspace/dist/

              echo
              echo "Produced packages:"
              ls -lh /workspace/dist
            '

      - name: Record build information
        env:
          NAME: ${{ matrix.name }}
          APORT: ${{ matrix.aport }}
        run: |
          set -euo pipefail

          {
            echo "name=$NAME"
            echo "aport=$APORT"
            echo "alpine_image=$ALPINE_IMAGE"
            echo "aports_branch=$APORTS_BRANCH"
            echo "aports_commit=$(git -C aports rev-parse HEAD)"
            echo
            echo "packages:"

            for package in dist/*.apk; do
              echo "  - $(basename "$package")"
            done
          } > dist/build-info.txt

          cat dist/build-info.txt

      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-alpine
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
