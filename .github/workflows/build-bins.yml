name: Build selected Alpine packages from aports

on:
  workflow_dispatch:

  push:
    branches:
      - builds
    tags:
      - "v*"

permissions:
  contents: read

env:
  ALPINE_IMAGE: alpine:edge
  APORTS_REF: master

  # Space-separated binary package names to include in the offline repository.
  #
  # Their dependency aports are resolved and built as well.
  ROOT_PACKAGES: >-
    curl
    git
    gcc
    g++
    cmake
    samurai
    make
    clang20-extra-tools
    ripgrep
    eza
    bat
    fd
    yazi
    fish
    delta
    erdtree
    uv
    lazygit
    glow
    fzf
    tmux
    neovim

jobs:
  build:
    name: Build selected x86_64 APK closure
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out Alpine aports
        uses: actions/checkout@v7
        with:
          repository: alpinelinux/aports
          ref: ${{ env.APORTS_REF }}
          path: aports
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare directories
        run: |
          set -euo pipefail

          mkdir -p \
            packages \
            distfiles \
            keys \
            metadata \
            offline-repository

          git -C aports rev-parse HEAD \
            > metadata/APORTS_COMMIT

          printf '%s\n' "$ROOT_PACKAGES" \
            | tr ' ' '\n' \
            | sed '/^$/d' \
            > metadata/world.txt

      - name: Resolve and build selected package closure
        env:
          ROOT_PACKAGES: ${{ env.ROOT_PACKAGES }}
        run: |
          set -euo pipefail

          docker run --rm \
            --privileged \
            --env ROOT_PACKAGES \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$ALPINE_IMAGE" \
            sh -euxc '
              apk add --no-cache \
                alpine-sdk \
                lua-aports \
                doas

              adduser -D builder
              addgroup builder abuild

              install -d -m 0755 /etc/doas.d

              printf "%s\n" \
                "permit nopass :abuild" \
                > /etc/doas.d/abuild.conf

              chmod 0600 /etc/doas.d/abuild.conf

              install -d \
                -o builder \
                -g builder \
                /home/builder/.abuild \
                /workspace/packages \
                /workspace/distfiles \
                /workspace/keys \
                /workspace/metadata

              chown -R builder:builder \
                /workspace/aports \
                /workspace/packages \
                /workspace/distfiles \
                /workspace/keys \
                /workspace/metadata

              su builder -c "
                set -eu
                abuild-keygen -a -n
              "

              private_key=""
              public_key=""

              for candidate in /home/builder/.abuild/*.rsa; do
                if [ -f "$candidate" ]; then
                  private_key="$candidate"
                  break
                fi
              done

              for candidate in /home/builder/.abuild/*.rsa.pub; do
                if [ -f "$candidate" ]; then
                  public_key="$candidate"
                  break
                fi
              done

              if [ -z "$private_key" ]; then
                echo "No private abuild key was generated" >&2
                exit 1
              fi

              if [ -z "$public_key" ]; then
                echo "No public abuild key was generated" >&2
                exit 1
              fi

              cp "$public_key" /etc/apk/keys/
              cp "$public_key" /workspace/keys/

              cat > /home/builder/.abuild/abuild.conf <<EOF
              REPODEST=/workspace/packages
              SRCDEST=/workspace/distfiles
              PACKAGER="Local Builder <builder@localhost>"
              PACKAGER_PRIVKEY="$private_key"
              JOBS=$(getconf _NPROCESSORS_ONLN)
              EOF

              chown builder:builder \
                /home/builder/.abuild/abuild.conf

              arch="$(apk --print-arch)"

              printf "%s\n" "$arch" \
                > /workspace/metadata/ARCHITECTURE

              cat /etc/alpine-release \
                > /workspace/metadata/ALPINE_RELEASE

              #
              # Build an aports package-name map.
              #
              # `ap builddirs` converts binary package names, including
              # subpackages, into their owning aport directories.
              #
              cd /workspace/aports

              : > /workspace/metadata/root-aports.txt

              for root_package in $ROOT_PACKAGES; do
                root_dir="$(
                  printf "%s\n" "$root_package" |
                    ap builddirs |
                    head -n 1
                )"

                if [ -z "$root_dir" ]; then
                  echo "Could not locate aport for: $root_package" >&2
                  exit 1
                fi

                printf "%s\n" "$root_dir" \
                  >> /workspace/metadata/root-aports.txt
              done

              sort -u \
                -o /workspace/metadata/root-aports.txt \
                /workspace/metadata/root-aports.txt

              echo
              echo "Root aports:"
              cat /workspace/metadata/root-aports.txt

              #
              # Resolve dependency package names recursively and convert all
              # resulting package names to their owning aport directories.
              #
              # Build/test dependencies may be installed as binaries by
              # `abuild -r`, but any dependency aport returned here is also
              # compiled and included in the local repository.
              #
              {
                printf "%s\n" $ROOT_PACKAGES

                ap recursdeps $ROOT_PACKAGES
              } |
                sed "/^$/d" |
                sort -u \
                > /workspace/metadata/dependency-packages.txt

              ap builddirs \
                < /workspace/metadata/dependency-packages.txt |
                sed "/^$/d" |
                sort -u \
                > /workspace/metadata/aport-closure.txt

              #
              # Ensure the requested roots are included even if a particular
              # lua-aports version omits input nodes from recursdeps output.
              #
              cat /workspace/metadata/root-aports.txt \
                >> /workspace/metadata/aport-closure.txt

              sort -u \
                -o /workspace/metadata/aport-closure.txt \
                /workspace/metadata/aport-closure.txt

              echo
              echo "Resolved aport closure:"
              cat /workspace/metadata/aport-closure.txt

              echo
              echo "Number of aports to build:"
              wc -l < /workspace/metadata/aport-closure.txt

              chown -R builder:builder \
                /workspace/packages \
                /workspace/distfiles \
                /workspace/metadata

              #
              # Each aport is built from its checked-out APKBUILD.
              #
              # `-r` permits the builder to install missing compilation and
              # test dependencies from its configured package repositories.
              # Those bootstrap APKs stay inside this disposable container.
              #
              while IFS= read -r aport_dir; do
                [ -n "$aport_dir" ] || continue

                case "$aport_dir" in
                  /*)
                    package_dir="$aport_dir"
                    ;;
                  *)
                    package_dir="/workspace/aports/$aport_dir"
                    ;;
                esac

                if [ ! -f "$package_dir/APKBUILD" ]; then
                  echo "Missing APKBUILD: $package_dir" >&2
                  exit 1
                fi

                echo
                echo "=================================================="
                echo "Building: $aport_dir"
                echo "=================================================="

                su builder -c "
                  set -eu
                  cd \"$package_dir\"
                  abuild -r
                "
              done < /workspace/metadata/aport-closure.txt

              echo
              echo "Built APK count:"
              find /workspace/packages \
                -type f \
                -name "*.apk" |
                wc -l

              echo
              echo "Built repository size:"
              du -sh /workspace/packages
            '

      - name: Assemble flat offline repository
        run: |
          set -euo pipefail

          while IFS= read -r -d '' package; do
            filename="$(basename "$package")"
            destination="offline-repository/$filename"

            if [[ -e "$destination" ]]; then
              if ! cmp --silent "$package" "$destination"; then
                echo "Conflicting APK files named: $filename" >&2
                echo "Existing: $destination" >&2
                echo "New:      $package" >&2
                exit 1
              fi

              continue
            fi

            cp -v "$package" "$destination"
          done < <(
            find packages \
              -type f \
              -name "*.apk" \
              -print0
          )

          if ! compgen -G "offline-repository/*.apk" >/dev/null; then
            echo "No APK files were built" >&2
            exit 1
          fi

          cp -v keys/*.rsa.pub offline-repository/
          cp -v metadata/* offline-repository/

          echo
          echo "Offline package count:"
          find offline-repository \
            -maxdepth 1 \
            -type f \
            -name "*.apk" |
            wc -l

          echo
          echo "Offline repository size:"
          du -sh offline-repository

      - name: Create repository index
        run: |
          set -euo pipefail

          docker run --rm \
            --volume \
              "$GITHUB_WORKSPACE/offline-repository:/repository" \
            "$ALPINE_IMAGE" \
            sh -euxc '
              apk index \
                --description \
                  "Locally built Alpine package closure" \
                --output /repository/APKINDEX.tar.gz \
                /repository/*.apk
            '

      - name: Verify repository without networking
        env:
          ROOT_PACKAGES: ${{ env.ROOT_PACKAGES }}
        run: |
          set -euo pipefail

          docker run --rm \
            --network none \
            --env ROOT_PACKAGES \
            --volume \
              "$GITHUB_WORKSPACE/offline-repository:/offline:ro" \
            "$ALPINE_IMAGE" \
            sh -euxc '
              public_key=""

              for candidate in /offline/*.rsa.pub; do
                if [ -f "$candidate" ]; then
                  public_key="$candidate"
                  break
                fi
              done

              if [ -z "$public_key" ]; then
                echo "No public signing key found" >&2
                exit 1
              fi

              cp "$public_key" /etc/apk/keys/

              printf "%s\n" /offline \
                > /etc/apk/repositories

              apk add \
                --no-network \
                --allow-untrusted \
                $ROOT_PACKAGES

              echo
              echo "Installed roots:"
              for package in $ROOT_PACKAGES; do
                apk info -e "$package"
              done

              echo
              echo "Neovim:"
              nvim --version

              echo
              echo "tmux:"
              tmux -V

              echo
              echo "fzf:"
              fzf --version
            '

      - name: Create repository archive
        run: |
          set -euo pipefail

          tar \
            --create \
            --zstd \
            --file alpine-edge-x86_64-offline-apks.tar.zst \
            offline-repository

          sha256sum \
            alpine-edge-x86_64-offline-apks.tar.zst \
            > alpine-edge-x86_64-offline-apks.tar.zst.sha256

          ls -lh \
            alpine-edge-x86_64-offline-apks.tar.zst \
            alpine-edge-x86_64-offline-apks.tar.zst.sha256

      - name: Upload offline APK repository
        uses: actions/upload-artifact@v6
        with:
          name: alpine-edge-x86_64-offline-apk-repository
          path: |
            offline-repository/
            alpine-edge-x86_64-offline-apks.tar.zst
            alpine-edge-x86_64-offline-apks.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload source cache
        uses: actions/upload-artifact@v6
        with:
          name: alpine-edge-source-distfiles
          path: distfiles/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
