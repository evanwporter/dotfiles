name: Build selected Alpine packages from source

on:
  workflow_dispatch:

  push:
    branches:
      - builds
    tags:
      - "v*"

permissions:
  contents: read

env:
  # Pin these to an image digest and aports commit for reproducible builds.
  ALPINE_IMAGE: alpine:edge
  APORTS_REF: master

  # These may be package names or subpackage names.
  ROOT_PACKAGES: >-
    curl
    git
    gcc
    g++
    cmake
    samurai
    make
    clang20-extra-tools
    ripgrep
    eza
    bat
    fd
    yazi
    fish
    delta
    erdtree
    uv
    lazygit
    glow
    fzf
    tmux
    neovim

jobs:
  build:
    name: Build selected package dependency closure
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out Alpine aports
        uses: actions/checkout@v4
        with:
          repository: alpinelinux/aports
          ref: ${{ env.APORTS_REF }}
          path: aports
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            packages \
            distfiles \
            keys \
            metadata \
            offline-repository

          git -C aports rev-parse HEAD > metadata/APORTS_COMMIT

          printf '%s\n' "$ROOT_PACKAGES" |
            tr ' ' '\n' |
            sed '/^[[:space:]]*$/d' \
            > metadata/ROOT_PACKAGES

          echo "Aports commit:"
          cat metadata/APORTS_COMMIT

          echo
          echo "Root packages:"
          cat metadata/ROOT_PACKAGES

      - name: Resolve and build source closure
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --privileged \
            --env ROOT_PACKAGES \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$ALPINE_IMAGE" \
            sh -euxc '
              apk add --no-cache \
                alpine-sdk \
                lua-aports \
                doas

              adduser -D builder
              addgroup builder abuild

              install -d -m 0755 /etc/doas.d

              printf "%s\n" \
                "permit nopass :abuild" \
                > /etc/doas.d/abuild.conf

              chmod 0600 /etc/doas.d/abuild.conf

              install -d \
                -o builder \
                -g builder \
                /home/builder/.abuild \
                /workspace/packages \
                /workspace/distfiles \
                /workspace/keys \
                /workspace/synthetic-aports/selected \
                /workspace/filtered-aports/selected \
                /workspace/build-logs

              chown -R builder:builder \
                /workspace/aports \
                /workspace/packages \
                /workspace/distfiles \
                /workspace/keys \
                /workspace/synthetic-aports \
                /workspace/filtered-aports \
                /workspace/build-logs \
                /workspace/metadata

              su builder -c "
                set -eu
                abuild-keygen -a -n
              "

              private_key=""
              public_key=""

              for candidate in /home/builder/.abuild/*.rsa; do
                if [ -f "$candidate" ]; then
                  private_key="$candidate"
                  break
                fi
              done

              for candidate in /home/builder/.abuild/*.rsa.pub; do
                if [ -f "$candidate" ]; then
                  public_key="$candidate"
                  break
                fi
              done

              if [ -z "$private_key" ] || [ -z "$public_key" ]; then
                echo "Could not find generated abuild signing keys" >&2
                exit 1
              fi

              cp "$public_key" /etc/apk/keys/
              cp "$public_key" /workspace/keys/

              cat > /home/builder/.abuild/abuild.conf <<ABUILD_CONFIG
          REPODEST=/workspace/packages
          SRCDEST=/workspace/distfiles
          PACKAGER="Local Builder <builder@localhost>"
          PACKAGER_PRIVKEY="$private_key"
          JOBS=$(getconf _NPROCESSORS_ONLN)
          ABUILD_CONFIG

              chown builder:builder \
                /home/builder/.abuild/abuild.conf

              arch="$(apk --print-arch)"

              printf "%s\n" "$arch" \
                > /workspace/metadata/ARCHITECTURE

              cat /etc/alpine-release \
                > /workspace/metadata/ALPINE_RELEASE

              ################################################################
              # Create one synthetic repository.
              #
              # ap normally operates on one repository at a time. Combining
              # the three aports sections here lets it resolve package names
              # across main, community, and testing.
              ################################################################

              for repository in main community testing; do
                find "/workspace/aports/$repository" \
                  -mindepth 2 \
                  -maxdepth 2 \
                  -type f \
                  -name APKBUILD \
                  -print |
                while IFS= read -r apkbuild; do
                  source_dir="${apkbuild%/APKBUILD}"
                  aport_name="${source_dir##*/}"
                  synthetic_name="${repository}__${aport_name}"

                  ln -s "$source_dir" \
                    "/workspace/synthetic-aports/selected/$synthetic_name"
                done
              done

              chown -hR builder:builder \
                /workspace/synthetic-aports

              ################################################################
              # Resolve the root package names to owning APKBUILD directories.
              #
              # builddirs recursively includes build-time dependencies and
              # prints the directories in dependency order.
              ################################################################

              set -- $ROOT_PACKAGES

              su builder -c "
                set -eu

                ap \
                  -d /workspace/synthetic-aports/selected \
                  builddirs \
                  \"\$@\" \
                  > /workspace/metadata/BUILD_DIRECTORIES
              " sh "$@"

              if [ ! -s /workspace/metadata/BUILD_DIRECTORIES ]; then
                echo "Dependency resolution returned no APKBUILD directories" >&2
                exit 1
              fi

              echo
              echo "Resolved APKBUILD directories:"
              cat /workspace/metadata/BUILD_DIRECTORIES

              ################################################################
              # Create a second repository containing only the resolved
              # APKBUILD directories.
              ################################################################

              while IFS= read -r resolved_dir; do
                [ -n "$resolved_dir" ] || continue

                case "$resolved_dir" in
                  /*)
                    source_dir="$resolved_dir"
                    ;;
                  *)
                    source_dir="/workspace/synthetic-aports/selected/$resolved_dir"
                    ;;
                esac

                if [ ! -f "$source_dir/APKBUILD" ]; then
                  echo "Resolved directory has no APKBUILD: $source_dir" >&2
                  exit 1
                fi

                filtered_name="${source_dir##*/}"

                ln -s "$source_dir" \
                  "/workspace/filtered-aports/selected/$filtered_name"
              done < /workspace/metadata/BUILD_DIRECTORIES

              chown -hR builder:builder \
                /workspace/filtered-aports

              echo
              echo "Filtered source repository contains:"

              find /workspace/filtered-aports/selected \
                -mindepth 1 \
                -maxdepth 1 \
                -type l \
                -print |
                sort

              ################################################################
              # Build only the filtered repository.
              #
              # buildrepo handles dependency ordering and repository indexes.
              ################################################################

              su builder -c "
                set -eu

                buildrepo \
                  --aports /workspace/filtered-aports \
                  --destdir /workspace/packages \
                  --logdir /workspace/build-logs \
                  selected
              "

              echo
              echo "Built APKs:"

              find /workspace/packages \
                -type f \
                -name "*.apk" \
                -print |
                sort

              count="$(
                find /workspace/packages \
                  -type f \
                  -name "*.apk" |
                wc -l
              )"

              if [ "$count" -eq 0 ]; then
                echo "buildrepo produced no APK files" >&2
                exit 1
              fi
            '

      - name: Assemble offline repository
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' package; do
            filename="$(basename "$package")"
            destination="offline-repository/$filename"

            if [[ -e "$destination" ]]; then
              if ! cmp --silent "$package" "$destination"; then
                echo "Conflicting APK files named $filename" >&2
                echo "Existing: $destination" >&2
                echo "New:      $package" >&2
                exit 1
              fi

              continue
            fi

            cp -v "$package" "$destination"
          done < <(
            find packages \
              -type f \
              -name '*.apk' \
              -print0
          )

          if ! compgen -G 'offline-repository/*.apk' >/dev/null; then
            echo "No APK files were produced" >&2
            exit 1
          fi

          cp -v keys/*.rsa.pub offline-repository/
          cp -v metadata/* offline-repository/

          cp metadata/ROOT_PACKAGES \
            offline-repository/world.txt

          echo
          echo "Offline repository APK count:"
          find offline-repository \
            -maxdepth 1 \
            -type f \
            -name '*.apk' |
            wc -l

      - name: Generate final APK index
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --volume \
              "$GITHUB_WORKSPACE/offline-repository:/repository" \
            "$ALPINE_IMAGE" \
            sh -euxc '
              apk index \
                --description \
                  "Locally source-built Alpine Edge x86_64 repository" \
                --output /repository/APKINDEX.tar.gz \
                /repository/*.apk
            '

      - name: Verify offline installation
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --network none \
            --volume \
              "$GITHUB_WORKSPACE/offline-repository:/offline:ro" \
            "$ALPINE_IMAGE" \
            sh -euxc '
              public_key=""

              for candidate in /offline/*.rsa.pub; do
                if [ -f "$candidate" ]; then
                  public_key="$candidate"
                  break
                fi
              done

              if [ -z "$public_key" ]; then
                echo "No abuild public key found" >&2
                exit 1
              fi

              cp "$public_key" /etc/apk/keys/

              printf "%s\n" /offline \
                > /etc/apk/repositories

              # The generated top-level APKINDEX is not signed because the
              # temporary private key is deliberately not exported.
              apk add \
                --no-network \
                --allow-untrusted \
                $(cat /offline/world.txt)

              echo
              echo "Installed root packages:"
              apk info \
                $(cat /offline/world.txt)
            '

      - name: Verify expected commands
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --network none \
            --volume \
              "$GITHUB_WORKSPACE/offline-repository:/offline:ro" \
            "$ALPINE_IMAGE" \
            sh -euxc '
              public_key=""

              for candidate in /offline/*.rsa.pub; do
                if [ -f "$candidate" ]; then
                  public_key="$candidate"
                  break
                fi
              done

              cp "$public_key" /etc/apk/keys/
              printf "%s\n" /offline > /etc/apk/repositories

              apk add \
                --no-network \
                --allow-untrusted \
                $(cat /offline/world.txt)

              curl --version
              git --version
              gcc --version
              g++ --version
              cmake --version
              ninja --version
              make --version
              clangd --version
              rg --version
              eza --version
              bat --version
              fd --version
              yazi --version
              fish --version
              delta --version
              erd --version
              uv --version
              lazygit --version
              glow --version
              fzf --version
              tmux -V
              nvim --version
            '

      - name: Create offline repository archive
        shell: bash
        run: |
          set -euo pipefail

          tar \
            --create \
            --zstd \
            --file alpine-edge-x86_64-offline-apks.tar.zst \
            offline-repository

          sha256sum \
            alpine-edge-x86_64-offline-apks.tar.zst \
            > alpine-edge-x86_64-offline-apks.tar.zst.sha256

          du -sh offline-repository

          ls -lh \
            alpine-edge-x86_64-offline-apks.tar.zst \
            alpine-edge-x86_64-offline-apks.tar.zst.sha256

      - name: Upload offline APK repository
        uses: actions/upload-artifact@v4
        with:
          name: alpine-edge-x86_64-offline-apk-repository
          path: |
            offline-repository/
            alpine-edge-x86_64-offline-apks.tar.zst
            alpine-edge-x86_64-offline-apks.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpine-apk-build-logs
          path: build-logs/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30

      - name: Upload source distfile cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpine-source-distfiles
          path: distfiles/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
