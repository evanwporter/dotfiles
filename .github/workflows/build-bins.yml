name: Build Alpine packages

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  ALPINE_IMAGE: alpine:edge

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - ripgrep
          - eza
          - bat
          - fd
          - yazi
          - fish
          - git-delta
          - erdtree
          - uv
          - lazygit
          - glow
          - fzf
          - tmux
          - neovim

    steps:
      - name: Clone Alpine aports
        run: |
          git clone \
            --depth=1 \
            https://gitlab.alpinelinux.org/alpine/aports.git \
            aports

      - name: Build ${{ matrix.name }}
        env:
          APORT: ${{ matrix.aport }}
        run: |
          set -euo pipefail

          docker run --rm \
            --privileged \
            --env APORT \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            alpine:edge \- name: Build ${{ matrix.name }}
