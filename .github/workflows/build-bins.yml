name: Build selected Alpine packages from aports

on:
  workflow_dispatch:

  push:
    branches:
      - builds
    tags:
      - "v*"

permissions:
  contents: read

env:
  ALPINE_IMAGE: alpine:edge
  APORTS_REF: master

jobs:
  build:
    name: Build selected package closure
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out Alpine aports
        uses: actions/checkout@v7
        with:
          repository: alpinelinux/aports
          ref: ${{ env.APORTS_REF }}
          path: aports
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare directories
        run: |
          set -euo pipefail

          mkdir -p \
            packages \
            distfiles \
            keys \
            metadata \
            offline-repository

          git -C aports rev-parse HEAD \
            > metadata/APORTS_COMMIT

      - name: Build selected packages and their dependencies
        run: |
          set -euo pipefail

          docker run --rm \
            --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$ALPINE_IMAGE" \
            sh -euxc '
              apk add --no-cache \
                alpine-sdk \
                lua-aports \
                doas

              adduser -D builder
              addgroup builder abuild

              install -d -m 0755 /etc/doas.d

              printf "%s\n" \
                "permit nopass :abuild" \
                > /etc/doas.d/abuild.conf

              chmod 0600 /etc/doas.d/abuild.conf

              install -d \
                -o builder \
                -g builder \
                /home/builder/.abuild \
                /workspace/packages \
                /workspace/distfiles \
                /workspace/keys \
                /workspace/filtered-aports

              chown -R builder:builder \
                /workspace/aports \
                /workspace/packages \
                /workspace/distfiles \
                /workspace/keys \
                /workspace/filtered-aports

              su builder -c "
                set -eu
                abuild-keygen -a -n
              "

              private_key=""

              for candidate in /home/builder/.abuild/*.rsa; do
                if [ -f "$candidate" ]; then
                  private_key="$candidate"
                  break
                fi
              done

              public_key=""

              for candidate in /home/builder/.abuild/*.rsa.pub; do
                if [ -f "$candidate" ]; then
                  public_key="$candidate"
                  break
                fi
              done

              if [ -z "$private_key" ] || [ -z "$public_key" ]; then
                echo "Could not locate generated abuild keys" >&2
                exit 1
              fi

              cp "$public_key" /etc/apk/keys/
              cp "$public_key" /workspace/keys/

              cat > /home/builder/.abuild/abuild.conf <<EOF
              REPODEST=/workspace/packages
              SRCDEST=/workspace/distfiles
              PACKAGER="Local Builder <builder@localhost>"
              PACKAGER_PRIVKEY="$private_key"
              JOBS=$(getconf _NPROCESSORS_ONLN)
              EOF

              chown builder:builder \
                /home/builder/.abuild/abuild.conf

              roots="
                curl
                git
                gcc
                g++
                cmake
                samurai
                make
                clang20-extra-tools
                ripgrep
                eza
                bat
                fd
                yazi
                fish
                delta
                erdtree
                uv
                lazygit
                glow
                fzf
                tmux
                neovim
              "

              printf "%s\n" $roots \
                > /workspace/metadata/ROOT_PACKAGES

              cd /workspace/aports

              # Resolve every aport required to build or install the roots.
              #
              # ap builddirs converts binary/subpackage names such as g++ or
              # clang20-extra-tools back to their owning aport directories.
              {
                printf "%s\n" $roots
                ap recursdeps $roots
              } |
                ap builddirs |
                sed "/^[[:space:]]*$/d" |
                sort -u \
                > /workspace/metadata/BUILD_DIRECTORIES

              echo
              echo "Resolved aport closure:"

              cat /workspace/metadata/BUILD_DIRECTORIES

              while IFS= read -r aport_dir; do
                [ -n "$aport_dir" ] || continue

                source_dir="/workspace/aports/$aport_dir"
                target_dir="/workspace/filtered-aports/$aport_dir"

                if [ ! -f "$source_dir/APKBUILD" ]; then
                  echo "Missing APKBUILD for resolved aport: $aport_dir" >&2
                  exit 1
                fi

                mkdir -p "${target_dir%/*}"
                cp -a "$source_dir" "$target_dir"
              done < /workspace/metadata/BUILD_DIRECTORIES

              chown -R builder:builder \
                /workspace/filtered-aports \
                /workspace/packages \
                /workspace/distfiles

              arch="$(apk --print-arch)"

              printf "%s\n" "$arch" \
                > /workspace/metadata/ARCHITECTURE

              # buildrepo operates on repository directories. Because these
              # directories contain only the resolved closure, it will not
              # build every package in the complete aports repository.
              for repository in main community testing; do
                repository_dir="/workspace/filtered-aports/$repository"

                if [ ! -d "$repository_dir" ]; then
                  continue
                fi

                echo
                echo "Building filtered $repository repository"

                su builder -c "
                  set -eu

                  buildrepo \
                    -a \"$arch\" \
                    -d /workspace/packages \
                    \"$repository_dir\"
                "
              done

              echo
              echo "Built package files:"

              find /workspace/packages \
                -type f \
                -name "*.apk" \
                -print |
                sort
            '

      - name: Assemble flat offline repository
        run: |
          set -euo pipefail

          while IFS= read -r -d "" package; do
            filename="$(basename "$package")"
            destination="offline-repository/$filename"

            if [[ -e "$destination" ]]; then
              if ! cmp --silent "$package" "$destination"; then
                echo "Conflicting APK files named $filename" >&2
                echo "Existing: $destination" >&2
                echo "New:      $package" >&2
                exit 1
              fi

              continue
            fi

            cp -v "$package" "$destination"
          done < <(
            find packages \
              -type f \
              -name "*.apk" \
              -print0
          )

          if ! compgen -G "offline-repository/*.apk" >/dev/null; then
            echo "No APK packages were produced" >&2
            exit 1
          fi

          cp -v keys/*.rsa.pub offline-repository/
          cp -v metadata/* offline-repository/

          cp metadata/ROOT_PACKAGES \
            offline-repository/world.txt

          echo
          echo "APK count:"

          find offline-repository \
            -maxdepth 1 \
            -type f \
            -name "*.apk" |
            wc -l

          du -sh offline-repository

      - name: Generate and sign repository index
        run: |
          set -euo pipefail

          docker run --rm \
            --volume "$GITHUB_WORKSPACE/offline-repository:/repository" \
            --volume "$GITHUB_WORKSPACE/keys:/keys:ro" \
            "$ALPINE_IMAGE" \
            sh -euxc '
              apk add --no-cache abuild

              apk index \
                --description \
                  "Source-built Alpine Edge x86_64 CLI repository" \
                --output /repository/APKINDEX.tar.gz \
                /repository/*.apk

              # The workflow currently exports only the public key, so the
              # flattened index cannot be signed here. Individual APKs remain
              # signed by abuild.
            '

      - name: Verify repository without networking
        run: |
          set -euo pipefail

          docker run --rm \
            --network none \
            --volume \
              "$GITHUB_WORKSPACE/offline-repository:/offline:ro" \
            "$ALPINE_IMAGE" \
            sh -euxc '
              public_key=""

              for candidate in /offline/*.rsa.pub; do
                if [ -f "$candidate" ]; then
                  public_key="$candidate"
                  break
                fi
              done

              if [ -z "$public_key" ]; then
                echo "No repository public key found" >&2
                exit 1
              fi

              cp "$public_key" /etc/apk/keys/

              printf "%s\n" \
                /offline \
                > /etc/apk/repositories

              apk add \
                --no-network \
                --allow-untrusted \
                curl \
                git \
                gcc \
                g++ \
                cmake \
                samurai \
                make \
                clang20-extra-tools \
                ripgrep \
                eza \
                bat \
                fd \
                yazi \
                fish \
                delta \
                erdtree \
                uv \
                lazygit \
                glow \
                fzf \
                tmux \
                neovim

              echo
              echo "Verifying installed commands"

              curl --version
              git --version
              gcc --version
              g++ --version
              cmake --version
              ninja --version
              make --version
              clangd --version
              rg --version
              eza --version
              bat --version
              fd --version
              yazi --version
              fish --version
              delta --version
              erd --version
              uv --version
              lazygit --version
              glow --version
              fzf --version
              tmux -V
              nvim --version
            '

      - name: Create repository archive
        run: |
          set -euo pipefail

          tar \
            --create \
            --zstd \
            --file alpine-edge-x86_64-source-built-apks.tar.zst \
            offline-repository

          sha256sum \
            alpine-edge-x86_64-source-built-apks.tar.zst \
            > alpine-edge-x86_64-source-built-apks.tar.zst.sha256

          ls -lh \
            alpine-edge-x86_64-source-built-apks.tar.zst \
            alpine-edge-x86_64-source-built-apks.tar.zst.sha256

      - name: Upload offline APK repository
        uses: actions/upload-artifact@v6
        with:
          name: alpine-edge-x86_64-source-built-apk-repository
          path: |
            offline-repository/
            alpine-edge-x86_64-source-built-apks.tar.zst
            alpine-edge-x86_64-source-built-apks.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload source distfile cache
        uses: actions/upload-artifact@v6
        with:
          name: alpine-edge-source-distfiles
          path: distfiles/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
