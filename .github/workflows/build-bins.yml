---
# yamllint disable rule:truthy
name: Build static Alpine-compatible binaries

on:
  workflow_dispatch:

  push:
    branches:
      - builds
    tags:
      - "v*"

permissions:
  contents: read

env:
  ALPINE_IMAGE: alpine:edge

jobs:
  go:
    name: Go / ${{ matrix.bin }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: alpine:edge

    strategy:
      fail-fast: false
      matrix:
        include:
          - bin: fzf
            package: github.com/junegunn/fzf
            version_arg: --version
          - bin: glow
            package: github.com/charmbracelet/glow
            version_arg: --version
          - bin: lazygit
            package: github.com/jesseduffield/lazygit
            version_arg: --version

    steps:
      - name: Install toolchain
        run: |
          apk add --no-cache \
            ca-certificates \
            file \
            git \
            go

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOBIN: /tmp/out
        run: |
          set -euo pipefail

          mkdir -p "$GOBIN"

          go install \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w" \
            "${{ matrix.package }}@latest"

          install -D -m 0755 \
            "$GOBIN/${{ matrix.bin }}" \
            "out/${{ matrix.bin }}"

      - name: Verify static binary
        run: |
          set -euo pipefail

          file_output="$(file "out/${{ matrix.bin }}")"
          ldd_output="$(ldd "out/${{ matrix.bin }}" 2>&1 || true)"

          printf '%s\n' "$file_output"
          printf '%s\n' "$ldd_output"

          static_re="statically linked|static-pie linked"
          static_re="$static_re|not a dynamic executable"
          static_re="$static_re|not a valid dynamic program"

          printf '%s\n%s\n' "$file_output" "$ldd_output" |
            grep -Eiq "$static_re"

          dynamic_re="dynamically linked|interpreter"
          if printf '%s\n' "$file_output" | grep -Eiq "$dynamic_re"; then
            exit 1
          fi

          "out/${{ matrix.bin }}" ${{ matrix.version_arg }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.bin }}-x86_64-linux-musl
          path: out/${{ matrix.bin }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  rust:
    name: Rust / ${{ matrix.bin }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: rust:alpine

    strategy:
      fail-fast: false
      matrix:
        include:
          - bin: eza
            crate: eza
            version_arg: --version
          - bin: erd
            crate: erdtree
            version_arg: --version
          - bin: delta
            crate: git-delta
            version_arg: --version
          - bin: fd
            crate: fd-find
            version_arg: --version
          - bin: yazi
            crate: yazi-fm
            extra_crates: yazi-cli
            version_arg: --version
          - bin: bat
            crate: bat
            version_arg: --version
          - bin: uv
            crate: uv
            version_arg: --version

    steps:
      - name: Install toolchain
        run: |
          apk add --no-cache \
            build-base \
            ca-certificates \
            cmake \
            file \
            git \
            libgit2-dev \
            libssh2-dev \
            musl-dev \
            openssl-dev \
            openssl-libs-static \
            perl \
            pkgconf

      - name: Build static binary
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          OPENSSL_STATIC: "1"
        run: |
          set -euo pipefail

          mkdir -p out

          rustup target add x86_64-unknown-linux-musl

          cargo install \
            --locked \
            --root /tmp/cargo-root \
            --target x86_64-unknown-linux-musl \
            "${{ matrix.crate }}" \
            ${{ matrix.extra_crates || '' }}

          install -D -m 0755 \
            "/tmp/cargo-root/bin/${{ matrix.bin }}" \
            "out/${{ matrix.bin }}"

      - name: Verify static binary
        run: |
          set -euo pipefail

          file_output="$(file "out/${{ matrix.bin }}")"
          ldd_output="$(ldd "out/${{ matrix.bin }}" 2>&1 || true)"

          printf '%s\n' "$file_output"
          printf '%s\n' "$ldd_output"

          static_re="statically linked|static-pie linked"
          static_re="$static_re|not a dynamic executable"
          static_re="$static_re|not a valid dynamic program"

          printf '%s\n%s\n' "$file_output" "$ldd_output" |
            grep -Eiq "$static_re"

          dynamic_re="dynamically linked|interpreter"
          if printf '%s\n' "$file_output" | grep -Eiq "$dynamic_re"; then
            exit 1
          fi

          "out/${{ matrix.bin }}" ${{ matrix.version_arg }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.bin }}-x86_64-linux-musl
          path: out/${{ matrix.bin }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  c-family:
    name: C/C++ / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container: alpine:edge

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tmux
            bins: tmux
            version_arg: -V
            script: |
              set -euo pipefail

              apk add --no-cache \
                autoconf \
                automake \
                build-base \
                ca-certificates \
                file \
                libevent-dev \
                libevent-static \
                ncurses-dev \
                ncurses-static \
                pkgconf \
                wget

              work=/tmp/build-tmux
              mkdir -p "$work" out
              cd "$work"

              tmux_base=https://github.com/tmux/tmux/releases/download
              tmux_version=3.5a
              tmux_url="$tmux_base/$tmux_version/tmux-$tmux_version.tar.gz"
              wget -O tmux.tar.gz "$tmux_url"
              tar -xf tmux.tar.gz
              cd tmux-3.5a
              PKG_CONFIG="pkgconf --static" \
              CFLAGS="-Os" \
              LDFLAGS="-static" \
              ./configure \
                --prefix=/usr \
                --enable-static
              make -j"$(nproc)"

              install -D -m 0755 tmux "$GITHUB_WORKSPACE/out/tmux"

          - name: git-curl
            bins: curl git
            version_arg: --version
            script: |
              set -euo pipefail

              apk add --no-cache \
                autoconf \
                build-base \
                ca-certificates \
                curl \
                expat-dev \
                expat-static \
                file \
                openssl-dev \
                openssl-libs-static \
                pcre2-dev \
                pcre2-static \
                perl \
                pkgconf \
                wget \
                zlib-dev \
                zlib-static

              work=/tmp/build-git-curl
              prefix=/tmp/git-curl-root
              mkdir -p "$work" "$prefix" out
              cd "$work"

              wget -O curl.tar.xz https://curl.se/download/curl-8.14.1.tar.xz
              tar -xf curl.tar.xz
              cd curl-8.14.1
              ./configure \
                --prefix="$prefix" \
                --disable-shared \
                --enable-static \
                --disable-ldap \
                --disable-ldaps \
                --without-brotli \
                --without-libidn2 \
                --without-libpsl \
                --without-nghttp2 \
                --without-zstd \
                --with-openssl \
                LDFLAGS="-static"
              make -j"$(nproc)"
              make install
              install -D -m 0755 src/curl "$GITHUB_WORKSPACE/out/curl"
              cd "$work"

              git_base=https://www.kernel.org/pub/software/scm/git
              git_version=2.50.1
              wget -O git.tar.xz "$git_base/git-$git_version.tar.xz"
              tar -xf git.tar.xz
              cd git-2.50.1
              make configure
              PKG_CONFIG_PATH="$prefix/lib/pkgconfig" \
              CFLAGS="-I$prefix/include -Os" \
              LDFLAGS="-L$prefix/lib -static" \
              ./configure \
                --prefix=/usr \
                --with-curl="$prefix" \
                --with-openssl
              make -j"$(nproc)" \
                NO_GETTEXT=YesPlease \
                NO_TCLTK=YesPlease \
                NO_INSTALL_HARDLINKS=YesPlease \
                CURL_LDFLAGS="-L$prefix/lib -lcurl -lssl -lcrypto -lz" \
                V=1

              install -D -m 0755 git "$GITHUB_WORKSPACE/out/git"

          - name: samurai
            bins: samurai ninja
            version_arg: --version
            script: |
              set -euo pipefail

              apk add --no-cache \
                build-base \
                ca-certificates \
                file \
                git

              git clone \
                --depth 1 \
                https://github.com/michaelforney/samurai.git \
                /tmp/samurai
              cd /tmp/samurai
              make -j"$(nproc)" LDFLAGS="-static"

              install -D -m 0755 samu "$GITHUB_WORKSPACE/out/samurai"
              install -D -m 0755 samu "$GITHUB_WORKSPACE/out/ninja"

          - name: cmake
            bins: cmake
            version_arg: --version
            script: |
              set -euo pipefail

              apk add --no-cache \
                build-base \
                ca-certificates \
                file \
                linux-headers \
                openssl-dev \
                perl \
                wget

              cmake_base=https://github.com/Kitware/CMake/releases/download
              cmake_version=4.1.0
              wget \
                -O /tmp/cmake.tar.gz \
                "$cmake_base/v$cmake_version/cmake-$cmake_version.tar.gz"
              mkdir -p /tmp/cmake-src out
              tar -xf /tmp/cmake.tar.gz -C /tmp/cmake-src --strip-components=1
              cd /tmp/cmake-src

              ./bootstrap \
                --parallel="$(nproc)" \
                --prefix=/usr \
                -- \
                -DBUILD_CursesDialog=OFF \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_EXE_LINKER_FLAGS=-static \
                -DCMAKE_USE_OPENSSL=OFF

              make -j"$(nproc)"
              install -D -m 0755 bin/cmake "$GITHUB_WORKSPACE/out/cmake"

          - name: fish
            bins: fish
            version_arg: --version
            script: |
              set -euo pipefail

              apk add --no-cache \
                build-base \
                ca-certificates \
                cmake \
                file \
                gettext-dev \
                gettext-static \
                ncurses-dev \
                ncurses-static \
                pcre2-dev \
                pcre2-static \
                rust \
                wget

              fish_base=https://github.com/fish-shell/fish-shell/releases/download
              fish_version=4.0.2
              wget \
                -O /tmp/fish.tar.xz \
                "$fish_base/$fish_version/fish-$fish_version.tar.xz"
              mkdir -p /tmp/fish-src /tmp/fish-build out
              tar -xf /tmp/fish.tar.xz -C /tmp/fish-src --strip-components=1

              cmake \
                -S /tmp/fish-src \
                -B /tmp/fish-build \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=OFF \
                -DCMAKE_EXE_LINKER_FLAGS=-static
              cmake --build /tmp/fish-build --parallel "$(nproc)"

              install -D -m 0755 \
                /tmp/fish-build/fish \
                "$GITHUB_WORKSPACE/out/fish"

          - name: neovim
            bins: nvim
            version_arg: --version
            script: |
              set -euo pipefail

              apk add --no-cache \
                autoconf \
                automake \
                build-base \
                ca-certificates \
                cmake \
                curl \
                file \
                gettext \
                gettext-dev \
                gettext-static \
                git \
                libtool \
                linux-headers \
                ninja \
                pkgconf \
                unzip

              git clone \
                --depth 1 \
                --branch stable \
                https://github.com/neovim/neovim.git \
                /tmp/neovim
              cd /tmp/neovim

              nvim_flags="-DBUILD_SHARED_LIBS=OFF"
              nvim_flags="$nvim_flags -DCMAKE_EXE_LINKER_FLAGS=-static"

              make -j"$(nproc)" \
                CMAKE_BUILD_TYPE=Release \
                CMAKE_EXTRA_FLAGS="$nvim_flags"

              install -D -m 0755 build/bin/nvim "$GITHUB_WORKSPACE/out/nvim"

    steps:
      - name: Build static binary
        shell: sh
        run: |
          ${{ matrix.script }}

      - name: Verify static binaries
        shell: sh
        run: |
          set -euo pipefail

          for bin in ${{ matrix.bins }}; do
            file_output="$(file "out/$bin")"
            ldd_output="$(ldd "out/$bin" 2>&1 || true)"

            printf '%s\n' "$file_output"
            printf '%s\n' "$ldd_output"

            static_re="statically linked|static-pie linked"
            static_re="$static_re|not a dynamic executable"
            static_re="$static_re|not a valid dynamic program"

            printf '%s\n%s\n' "$file_output" "$ldd_output" |
              grep -Eiq "$static_re"

            dynamic_re="dynamically linked|interpreter"
            if printf '%s\n' "$file_output" | grep -Eiq "$dynamic_re"; then
              exit 1
            fi

            "out/$bin" ${{ matrix.version_arg }}
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: static-${{ matrix.name }}-x86_64-linux-musl
          path: out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  verify:
    name: Verify all binaries on Alpine
    runs-on: ubuntu-24.04
    needs:
      - go
      - rust
      - c-family
    timeout-minutes: 30
    container: alpine:edge

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify commands
        run: |
          set -euo pipefail

          apk add --no-cache file

          mkdir -p /usr/local/bin
          find artifacts -maxdepth 3 -type f -print -exec chmod 0755 {} \;
          find artifacts -maxdepth 3 -type f -exec cp {} /usr/local/bin/ \;

          expected="
          fzf
          tmux
          git
          curl
          nvim
          glow
          lazygit
          eza
          erd
          delta
          fd
          ninja
          samurai
          cmake
          yazi
          fish
          bat
          uv
          "

          for bin in $expected; do
            command -v "$bin"
            file_output="$(file "$(command -v "$bin")")"
            ldd_output="$(ldd "$(command -v "$bin")" 2>&1 || true)"

            printf '%s\n' "$file_output"
            printf '%s\n' "$ldd_output"

            static_re="statically linked|static-pie linked"
            static_re="$static_re|not a dynamic executable"
            static_re="$static_re|not a valid dynamic program"

            printf '%s\n%s\n' "$file_output" "$ldd_output" |
              grep -Eiq "$static_re"

            dynamic_re="dynamically linked|interpreter"
            if printf '%s\n' "$file_output" | grep -Eiq "$dynamic_re"; then
              exit 1
            fi
          done

          fzf --version
          tmux -V
          git --version
          curl --version
          nvim --version
          glow --version
          lazygit --version
          eza --version
          erd --version
          delta --version
          fd --version
          ninja --version
          samurai --version
          cmake --version
          yazi --version
          fish --version
          bat --version
          uv --version
