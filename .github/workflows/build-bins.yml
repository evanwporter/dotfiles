name: Build selected Alpine packages from aports

on:
  workflow_dispatch:

  push:
    branches:
      - builds
    tags:
      - "v*"

permissions:
  contents: read

env:
  ALPINE_IMAGE: alpine:edge
  APORTS_REF: master

  # Binary package names wanted in the final offline repository.
  ROOT_PACKAGES: >-
    fzf
    tmux
    neovim

jobs:
  build:
    name: Build selected x86_64 APK runtime closure
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out Alpine aports
        uses: actions/checkout@v7
        with:
          repository: alpinelinux/aports
          ref: ${{ env.APORTS_REF }}
          path: aports
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare workspace
        run: |
          set -euo pipefail

          mkdir -p \
            packages \
            distfiles \
            keys \
            metadata \
            offline-repository

          git -C aports rev-parse HEAD \
            > metadata/APORTS_COMMIT

          printf '%s\n' $ROOT_PACKAGES \
            > metadata/world.txt

          echo "Aports commit:"
          cat metadata/APORTS_COMMIT

          echo
          echo "Requested binary packages:"
          cat metadata/world.txt

      - name: Resolve runtime closure and build its aports
        env:
          ROOT_PACKAGES: ${{ env.ROOT_PACKAGES }}
        run: |
          set -euo pipefail

          docker run --rm \
            --privileged \
            --env ROOT_PACKAGES \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$ALPINE_IMAGE" \
            sh -euxc '
              #
              # Disposable build infrastructure.
              #
              # These packages may come from Alpine binary repositories.
              # They are not included in the final repository unless their
              # corresponding aports are part of the selected runtime closure.
              #
              apk add --no-cache \
                alpine-sdk \
                doas

              if ! apk query --help >/dev/null 2>&1; then
                echo "This Alpine image does not provide apk query" >&2
                echo "Use a current alpine:edge image with apk-tools 3." >&2
                exit 1
              fi

              adduser -D builder
              addgroup builder abuild

              install -d -m 0755 /etc/doas.d

              printf "%s\n" \
                "permit nopass :abuild" \
                > /etc/doas.d/abuild.conf

              chmod 0600 /etc/doas.d/abuild.conf

              install -d \
                -o builder \
                -g builder \
                /home/builder/.abuild \
                /workspace/packages \
                /workspace/distfiles \
                /workspace/keys \
                /workspace/metadata

              chown -R builder:builder \
                /workspace/aports \
                /workspace/packages \
                /workspace/distfiles \
                /workspace/keys \
                /workspace/metadata

              su builder -c "
                set -eu
                abuild-keygen -a -n
              "

              private_key=""
              public_key=""

              for candidate in /home/builder/.abuild/*.rsa; do
                if [ -f "$candidate" ]; then
                  private_key="$candidate"
                  break
                fi
              done

              for candidate in /home/builder/.abuild/*.rsa.pub; do
                if [ -f "$candidate" ]; then
                  public_key="$candidate"
                  break
                fi
              done

              if [ -z "$private_key" ]; then
                echo "No private abuild key was generated" >&2
                exit 1
              fi

              if [ -z "$public_key" ]; then
                echo "No public abuild key was generated" >&2
                exit 1
              fi

              cp "$public_key" /etc/apk/keys/
              cp "$public_key" /workspace/keys/

              jobs="$(getconf _NPROCESSORS_ONLN)"
              arch="$(apk --print-arch)"

              printf "%s\n" \
                "REPODEST=/workspace/packages" \
                "SRCDEST=/workspace/distfiles" \
                "PACKAGER=\"Local Builder <builder@localhost>\"" \
                "PACKAGER_PRIVKEY=\"$private_key\"" \
                "JOBS=$jobs" \
                > /home/builder/.abuild/abuild.conf

              chown builder:builder \
                /home/builder/.abuild/abuild.conf

              printf "%s\n" "$arch" \
                > /workspace/metadata/ARCHITECTURE

              cat /etc/alpine-release \
                > /workspace/metadata/ALPINE_RELEASE

              echo
              echo "Architecture: $arch"
              echo "Build jobs:   $jobs"

              #
              # Resolve the binary runtime dependency closure with apk.
              #
              # The origin field identifies the source aport that produced
              # each selected binary package. Multiple subpackages can map to
              # the same origin, so sort -u gives one build per aport.
              #
              apk query \
                --recursive \
                --summarize origin \
                $ROOT_PACKAGES |
                sed \
                  -e "s/^[[:space:]]*//" \
                  -e "s/[[:space:]]*$//" \
                  -e "/^$/d" |
                sort -u \
                > /workspace/metadata/aport-origins.txt

              if [ ! -s /workspace/metadata/aport-origins.txt ]; then
                echo "Dependency resolution returned no aport origins" >&2
                exit 1
              fi

              echo
              echo "Resolved source aports:"
              cat /workspace/metadata/aport-origins.txt

              echo
              echo "Number of source aports:"
              wc -l < /workspace/metadata/aport-origins.txt

              #
              # Map every origin to its APKBUILD directory.
              #
              # Alpine repository policy permits:
              #
              #   main      -> main
              #   community -> main, community
              #   testing   -> main, community, testing
              #
              # An origin should therefore occur only once in the active
              # aports tree. Fail if no APKBUILD or multiple APKBUILDs match.
              #
              : > /workspace/metadata/aport-directories.txt

              while IFS= read -r origin; do
                [ -n "$origin" ] || continue

                matches=""

                for repository in main community testing; do
                  candidate="/workspace/aports/$repository/$origin/APKBUILD"

                  if [ -f "$candidate" ]; then
                    matches="$matches
              /workspace/aports/$repository/$origin"
                  fi
                done

                matches="$(
                  printf "%s\n" "$matches" |
                    sed "/^$/d"
                )"

                match_count="$(
                  printf "%s\n" "$matches" |
                    sed "/^$/d" |
                    wc -l
                )"

                if [ "$match_count" -eq 0 ]; then
                  echo "Could not find APKBUILD for origin: $origin" >&2
                  exit 1
                fi

                if [ "$match_count" -ne 1 ]; then
                  echo "Found multiple APKBUILDs for origin: $origin" >&2
                  printf "%s\n" "$matches" >&2
                  exit 1
                fi

                printf "%s\n" "$matches" \
                  >> /workspace/metadata/aport-directories.txt
              done < /workspace/metadata/aport-origins.txt

              echo
              echo "APKBUILD directories:"
              cat /workspace/metadata/aport-directories.txt

              chown -R builder:builder \
                /workspace/packages \
                /workspace/distfiles \
                /workspace/metadata

              #
              # Build each source aport.
              #
              # Order is not significant here because abuild -r is allowed to
              # install compilation dependencies from the builder repositories.
              # Every aport in the final runtime closure is nevertheless built
              # from the checked-out APKBUILD.
              #
              while IFS= read -r package_dir; do
                [ -n "$package_dir" ] || continue

                if [ ! -f "$package_dir/APKBUILD" ]; then
                  echo "Missing APKBUILD: $package_dir" >&2
                  exit 1
                fi

                echo
                echo "=================================================="
                echo "Building: ${package_dir#/workspace/aports/}"
                echo "=================================================="

                su builder -c "
                  set -eu
                  cd \"$package_dir\"
                  abuild -r
                "
              done < /workspace/metadata/aport-directories.txt

              built_count="$(
                find /workspace/packages \
                  -type f \
                  -name "*.apk" |
                  wc -l
              )"

              if [ "$built_count" -eq 0 ]; then
                echo "No APK packages were built" >&2
                exit 1
              fi

              echo
              echo "Built APK count: $built_count"

              echo
              echo "Built package tree:"
              find /workspace/packages \
                -type f \
                -name "*.apk" \
                -print |
                sort

              echo
              echo "Built repository size:"
              du -sh /workspace/packages
            '

      - name: Collect built APKs
        run: |
          set -euo pipefail

          while IFS= read -r -d '' package; do
            filename="$(basename "$package")"
            destination="offline-repository/$filename"

            if [[ -e "$destination" ]]; then
              if ! cmp --silent "$package" "$destination"; then
                echo "Conflicting APK files named: $filename" >&2
                echo "Existing: $destination" >&2
                echo "New:      $package" >&2
                exit 1
              fi

              continue
            fi

            cp -v "$package" "$destination"
          done < <(
            find packages \
              -type f \
              -name "*.apk" \
              -print0
          )

          if ! compgen -G "offline-repository/*.apk" >/dev/null; then
            echo "No APK files were found under packages/" >&2
            exit 1
          fi

          cp -v keys/*.rsa.pub offline-repository/
          cp -v metadata/* offline-repository/

          echo
          echo "Collected APK count:"
          find offline-repository \
            -maxdepth 1 \
            -type f \
            -name "*.apk" |
            wc -l

          echo
          echo "Collected repository size:"
          du -sh offline-repository

      - name: Create final APK index
        run: |
          set -euo pipefail

          docker run --rm \
            --volume \
              "$GITHUB_WORKSPACE/offline-repository:/repository" \
            "$ALPINE_IMAGE" \
            sh -euxc '
              apk index \
                --allow-untrusted \
                --description \
                  "Locally source-built Alpine runtime closure" \
                --output /repository/APKINDEX.tar.gz \
                /repository/*.apk

              echo
              echo "Repository index:"
              ls -lh /repository/APKINDEX.tar.gz
            '

      - name: Verify repository without networking
        env:
          ROOT_PACKAGES: ${{ env.ROOT_PACKAGES }}
        run: |
          set -euo pipefail

          docker run --rm \
            --network none \
            --env ROOT_PACKAGES \
            --volume \
              "$GITHUB_WORKSPACE/offline-repository:/offline:ro" \
            "$ALPINE_IMAGE" \
            sh -euxc '
              public_key=""

              for candidate in /offline/*.rsa.pub; do
                if [ -f "$candidate" ]; then
                  public_key="$candidate"
                  break
                fi
              done

              if [ -z "$public_key" ]; then
                echo "No public signing key was found" >&2
                exit 1
              fi

              cp "$public_key" /etc/apk/keys/

              printf "%s\n" /offline \
                > /etc/apk/repositories

              apk add \
                --no-network \
                --allow-untrusted \
                $ROOT_PACKAGES

              echo
              echo "Installed requested packages:"

              for package in $ROOT_PACKAGES; do
                apk info -e "$package"
              done

              echo
              echo "fzf:"
              fzf --version

              echo
              echo "tmux:"
              tmux -V

              echo
              echo "Neovim:"
              nvim --version
            '

      - name: Create repository archive
        run: |
          set -euo pipefail

          tar \
            --create \
            --zstd \
            --file alpine-edge-x86_64-offline-apks.tar.zst \
            offline-repository

          sha256sum \
            alpine-edge-x86_64-offline-apks.tar.zst \
            > alpine-edge-x86_64-offline-apks.tar.zst.sha256

          echo
          ls -lh \
            alpine-edge-x86_64-offline-apks.tar.zst \
            alpine-edge-x86_64-offline-apks.tar.zst.sha256

      - name: Upload offline APK repository
        uses: actions/upload-artifact@v6
        with:
          name: alpine-edge-x86_64-offline-apk-repository
          path: |
            offline-repository/
            alpine-edge-x86_64-offline-apks.tar.zst
            alpine-edge-x86_64-offline-apks.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload source distfile cache
        uses: actions/upload-artifact@v6
        with:
          name: alpine-edge-source-distfiles
          path: distfiles/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
