name: Build Alpine packages

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  ALPINE_IMAGE: alpine:edge

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - ripgrep
          - eza
          - bat
          - fd
          - yazi
          - fish
          - git-delta
          - erdtree
          - uv
          - lazygit
          - glow
          - fzf
          - tmux
          - neovim

    steps:
      - name: Check out aports
        uses: actions/checkout@v4
        with:
          repository: alpine/aports
          path: aports

      - name: Build ${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail

          docker run --rm \
            --privileged \
            --env PACKAGE \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$ALPINE_IMAGE" \
            sh -euxc '
              apk add --no-cache \
                alpine-sdk \
                doas \
                findutils

              adduser -D builder
              addgroup builder abuild

              echo "permit nopass builder" > /etc/doas.d/builder.conf

              mkdir -p /home/builder/.abuild
              chown -R builder:builder \
                /home/builder \
                /workspace/aports

              su builder -c "
                abuild-keygen -a -n

                cd /workspace/aports

                package_dir=\$(
                  find main community testing \
                    -mindepth 2 \
                    -maxdepth 2 \
                    -type d \
                    -name \"$PACKAGE\" \
                    -print \
                    -quit
                )

                test -n \"\$package_dir\"

                cd \"\$package_dir\"
                abuild -r
              "

              mkdir -p /workspace/dist

              find /home/builder/packages \
                -type f \
                -name "*.apk" \
                -exec cp {} /workspace/dist/ \;

              test -n "$(find /workspace/dist -name "*.apk" -print -quit)"
            '

      - name: Upload ${{ matrix.package }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-alpine
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
