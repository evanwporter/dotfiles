set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:Tc"
set -as terminal-features ",xterm-kitty:extkeys"
set -as terminal-features ",st*:extkeys"

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

set -s extended-keys on
set -s extended-keys-format xterm

set -g focus-events on
set -g mouse on

set -g allow-passthrough on

bind-key & kill-window

set -s command-alias[100] 'ks=kill-session'

bind-key w run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/window.sh switch"

# Use Vi keybindings in copy mode
set-option -g mode-keys vi

# Use Vi keybindings in the command prompt (Prefix + :)
set-option -g status-keys vi

# Switch to windows 1-9 and 0 with Alt+Number
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-0 select-window -t 0

# List of plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @resurrect-strategy-nvim 'session'

TMUX_FZF_OPTIONS="-p -w 90% -h 80% -m"

run-shell -b "bash ~/.config/tmux/statusline.tmux"

if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
